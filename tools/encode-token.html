<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Observe BRUM — Token Encoder</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 20px; color: #1a1a1a; }
        h1 { font-size: 1.4rem; margin-bottom: 4px; }
        p.subtitle { color: #666; margin-top: 0; font-size: 0.9rem; }
        textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; padding: 10px; border: 1px solid #d0d0d0; border-radius: 6px; }
        textarea[readonly] { background: #f7f7f7; }
        button { background: #5e72e4; color: white; border: 0; padding: 10px 18px; border-radius: 6px; font-size: 14px; cursor: pointer; margin: 10px 0; }
        button:hover { background: #4a5cc4; }
        .row { margin: 18px 0; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.9rem; }
        .note { background: #fff8e1; border-left: 3px solid #f0c040; padding: 10px 14px; font-size: 0.85rem; color: #6b5310; border-radius: 4px; margin: 20px 0; }
    </style>
</head>
<body>
    <h1>Observe BRUM — Token Encoder</h1>
    <p class="subtitle">Encode your bearer token for use in <code>window.OBSERVE_BRUM.bearer_token</code>. Runs entirely in your browser — nothing is sent over the network.</p>

    <div class="row">
        <label for="raw">Raw bearer token</label>
        <textarea id="raw" rows="3" placeholder="paste your raw token here, e.g. ds14BpXQOUCVf4QiyQBx:b2B-s0rmSM1oyCU-g2jbalwJomitRXf5"></textarea>
    </div>

    <button id="encode-btn">Encode &rarr;</button>
    <button id="decode-btn">Decode (verify roundtrip)</button>

    <div class="row">
        <label for="encoded">Encoded value (paste into <code>OBSERVE_BRUM.bearer_token</code>)</label>
        <textarea id="encoded" rows="3" readonly></textarea>
    </div>

    <script>
        // Mirror of decodeBrumToken in frontend/src/telemetry/brum.js — keep in sync.
        function encode(raw) {
            if (!raw) return '';
            const a = raw.split('').reverse().join('');         // reverse bytes
            const b = btoa(a);                                  // base64
            const c = b.split('').reverse().join('');           // reverse string
            const d = btoa(c);                                  // base64
            return 'OBV1:' + d;
        }
        function decode(s) {
            if (!s) return '';
            if (s.indexOf('OBV1:') !== 0) return s;
            try {
                const a = atob(s.slice(5));
                const b = a.split('').reverse().join('');
                const c = atob(b);
                return c.split('').reverse().join('');
            } catch (_) { return ''; }
        }

        document.getElementById('encode-btn').addEventListener('click', () => {
            const raw = document.getElementById('raw').value.trim();
            document.getElementById('encoded').value = encode(raw);
        });
        document.getElementById('decode-btn').addEventListener('click', () => {
            const enc = document.getElementById('encoded').value.trim();
            document.getElementById('raw').value = decode(enc);
        });
    </script>
</body>
</html>
