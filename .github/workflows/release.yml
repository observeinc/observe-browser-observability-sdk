# Builds the SDK bundle and publishes it as a GitHub release.
#
# Run it from the Actions tab (Release > Run workflow). The release tag is
# v<version> from package.json, and the only asset is dist/observe-brum.js.
# The run fails if the tag already exists, so bump the version first.
name: Release

on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Read version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Fail if the release already exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release $TAG already exists. Bump the version in package.json."
            exit 1
          fi

      # Production build: minified, no source map. The version comes from package.json.
      - name: Build
        run: ./build.sh

      # The bundle tests load dist/observe-brum.js, so they run after the build.
      - name: Test
        run: npm run test:unit

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          FLAGS=()
          if [[ "$PRERELEASE" == "true" ]]; then FLAGS+=(--prerelease); fi
          gh release create "$TAG" dist/observe-brum.js \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes \
            "${FLAGS[@]}"
